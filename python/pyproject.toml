[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskweave"
version = "0.1.0"
description = "Taskweave scheduling engine"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "ortools>=9.11.4210",
    "pyyaml>=6.0.2",
]

[project.scripts]
taskweave = "taskweave.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
